[package]
name = "stellascrack-food"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Stella's Crack Food - A magical farming mod with biome-based cooking, custom effects, sparkles, and upgrades"

[lib]
path = "mixins/stellascrack_food/runtime.rs"

[[bin]]
name = "stellascrack-food-content"
path = "mixins/stellascrack_content/mod.rs"

[workspace]
members = ["tools/audit"]
resolver = "2"
