[mod]
id = "stellascrack_food"
version = "0.1.0"

[compatibility]
horizon_revision = "a9a30a3b6e3c246747748572e7b10c5fc6b9dc5e"

[[injection]]
id = "register-blocks"
hook = "block_display"
hook_version = 1
kind = "HEAD"
helper = "runtime.rs"
bindings = [{ name = "blocks", ty = "&mut Vec<Block>", value = "blocks" }]

[[injection]]
id = "right-click-block"
hook = "break_block"
hook_version = 1
kind = "HEAD"
cancellable = true
helper = "runtime.rs"
bindings = [
  { name = "game",   ty = "&mut Game", value = "self" },
  { name = "pos",    ty = "[i32; 3]",  value = "pos" },
  { name = "face",   ty = "[i32; 3]",  value = "face" },
  { name = "hand",   ty = "Hand",      value = "hand" },
  { name = "cancel", ty = "&mut bool", value = "cancel" },
]
